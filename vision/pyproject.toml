[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-vision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
capture = ["opencv-python>=4.10,<5"]

[project.scripts]
radar-vision = "radar_vision.cli:main"
radar-vision-stream = "radar_vision.stream:main"
radar-vision-setup = "radar_vision.setup:main"

[tool.setuptools.packages.find]
where = ["src"]
